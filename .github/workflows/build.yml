name: Crear instaladores

# Se publica sola una versión nueva cuando cambia el número de versión en package.json.
on:
  push:
    branches: [main]
    paths: ['src/**', 'main.js', 'preload.js', 'package.json', 'build/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      nueva: ${{ steps.v.outputs.nueva }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "nueva=false" >> "$GITHUB_OUTPUT"; echo "La versión $VERSION ya está publicada: no se hace nada."
          else
            echo "nueva=true" >> "$GITHUB_OUTPUT"; echo "Versión nueva: $VERSION"
          fi

  build:
    needs: comprobar
    if: needs.comprobar.outputs.nueva == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Preparar macOS (evita que el .dmg falle al cerrarse)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - name: Crear .zip de Mac (copia de seguridad del instalador)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npx electron-builder --mac zip --arm64 --publish never
          npx electron-builder --mac zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # sin firma de Apple por ahora
      - name: Crear .dmg de Mac, una arquitectura cada vez
        id: dmg
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          npx electron-builder --mac dmg --arm64 --publish never
          hdiutil detach -force /Volumes/Rutina || true
          sleep 5
          npx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Crear instalador de Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: instaladores-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
      - name: Avisar si el .dmg no se creó
        if: steps.dmg.outcome == 'failure'
        run: echo "::error::El .dmg de Mac falló; queda el .zip como alternativa." && exit 1

  publicar:
    needs: [comprobar, build]
    if: ${{ !cancelled() && needs.comprobar.outputs.nueva == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: instaladores, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.comprobar.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Rutina ${{ needs.comprobar.outputs.version }}
          files: instaladores/*
