name: Publicar la web (aviso de dirección nueva)

# La web y la app viven ahora en https://rutina-fitness.netlify.app (se publica desde Netlify, ver netlify.toml).
# Esta dirección antigua de GitHub Pages solo redirige a la nueva.
on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: redirect }
      - id: d
        uses: actions/deploy-pages@v4
